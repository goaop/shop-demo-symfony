; OPcache settings of the production-style image
opcache.enable=1
; the built-in web server of the demo is a CLI SAPI
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=50000
; immutable image: never stat the files again
opcache.validate_timestamps=0
; primed at build time (step 3 of the Dockerfile), read-only at runtime
opcache.file_cache=/var/cache/opcache
opcache.file_cache_consistency_checks=0
opcache.file_cache_read_only=1
; PHP 8.5.11 / 8.5.12: the tracing JIT has a bug of its own
opcache.jit=disable
; the _preload.php of the AOP cache, then Symfony's container preload file (config/preload.php)
opcache.preload=/app/config/preload.php
opcache.preload_user=www-data
